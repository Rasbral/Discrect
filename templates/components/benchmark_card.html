    <div style="background: var(--bg-panel-alt); height: 8px; border-radius: 4px; width: 100%; margin-bottom: 10px;">

<div style="background: var(--bg-panel-alt); padding: 15px; border-radius: var(--radius-sm); margin-bottom: 20px; text-align: center;">
