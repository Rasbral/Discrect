<div class="panel" style="margin-bottom: 20px;">
    <h2 class="panel__title"> Proyección de Demanda vs Capacidad</h2>
    <div id="chart-empty-state" class="empty-state">Inicia la simulación para visualizar la curva de demanda.</div>
    <div class="chart-canvas-wrap">
        <canvas id="capacity-chart"></canvas>
    </div>
</div>

<div id="math-solution-panel" class="panel" hidden>
    <h2 class="panel__title"> Resolución Simbólica (SymPy)</h2>
    <div style="background: var(--bg-panel-alt); padding: 15px; border-radius: var(--radius-sm); margin-bottom: 15px;">
        <p style="margin: 0 0 10px 0;"><strong>Ecuación Característica:</strong> <span id="math-char-poly" style="font-family: monospace; color: var(--accent-blue);"></span></p>
        <p style="margin: 0 0 10px 0;"><strong>Caso Teórico:</strong> <span id="math-solution-type"></span></p>
        <p style="margin: 0;"><strong>Fórmula Explícita Cerrada:</strong> <span id="math-explicit-formula" style="font-family: monospace; color: var(--accent-success);"></span></p>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <table border="1" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; border-color: var(--border-subtle);">
            <thead style="background: var(--bg-panel-alt);"><tr><th style="padding: 5px;">Raíz</th><th>Valor</th><th>Módulo |r|</th><th>Mult.</th><th>Tipo</th></tr></thead>
            <tbody id="roots-table"></tbody>
        </table>
        
        <table border="1" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; border-color: var(--border-subtle);">
            <thead style="background: var(--bg-panel-alt);"><tr><th style="padding: 5px;">Constantes</th><th>Valor Calculado</th></tr></thead>
            <tbody id="constants-table"></tbody>
        </table>
    </div>
    <ul id="steps-list" hidden></ul>
</div>
